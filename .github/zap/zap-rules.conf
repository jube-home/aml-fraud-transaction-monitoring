# OUTOFSCOPE lines take a URL regex as their third field instead of a message, and zap_common.py
# drops matching alerts in zap_get_alerts while leaving the rule enabled and running everywhere
# else. The regex is applied with re.match, so it is anchored at the start of the URL only, hence
# the explicit terminators below. Every entry here is a finding that has been traced to source and
# shown to be a property of the endpoint rather than a defect; nothing is scoped out merely for
# being noisy.
#
# There is deliberately no entry here for /api/MockHttpAdaptation/ServerError. That fixture returns a
# 500 by design, and rules 100000 and 90022 both key off the status code rather than the body -- 90022
# returns early only at the HIGH alert threshold -- so no amount of reshaping the response would have
# silenced them, and reshaping it would have cost the "non-protocol plain-text body" case the fixture
# exists to exercise. Instead the scan stack sets EnableMockEndpoints=False, so the test doubles are
# never mapped and never scanned, and all three rules stay live everywhere for real endpoints.
#
# The API passes declare servers[].url as the application root, so ZAP probes that root, follows the
# redirect onto the sign-in page, and reaches the two Server-Sent Events endpoints, expecting JSON
# from all of them. The Razor sign-in page correctly serves text/html and both stream endpoints
# correctly serve text/event-stream; a JSON content type on any of them would be the defect. The
# root itself is no longer listed: it now answers with a body-less redirect rather than a 302
# carrying a fully rendered page, so there is no content type on it to object to.
100001	OUTOFSCOPE	https?://[^/]+/Account(/.*)?(\?.*)?$
100001	OUTOFSCOPE	https?://[^/]+/api/(ServiceChange|Watcher)/Stream/?(\?.*)?$
#
# These five endpoints read live pg_stat views rather than stored history, and the request itself
# increments the scan and tuple counters it reports, so no two responses are ever byte-identical.
# Rule 40018's boolean-based technique decides injection by comparing an "AND 1=1" response against
# the original and an "AND 1=2" response against that, which on a body that drifts between every
# request compares noise and alerts at random. The sortField and sortDirection parameters it flags
# cannot reach SQL at all: each service's ApplySort is a switch expression over a closed set of
# literals selecting a typed LINQ key selector on an already-materialised List, unrecognised values
# fall through to the unsorted list, and the statement itself is a compile-time constant with no
# parameters and a fixed ORDER BY. Each service test class runs that same differential straight at
# the service in ListIgnoresInjectionInSortFieldAndSortDirectionAsync, where no request guard stands
# in the way, and PenTestPostgresMonitoring runs it again over HTTP, so this scoping removes a false
# positive rather than cover. Note that the scan stack sets WafEnabled=False, so unlike the pen test
# host it really does carry these payloads to the service -- the path the service tests assert.
40018	OUTOFSCOPE	https?://[^/]+/api/Postgres(Activity|IndexStatistics|ReplicationStatus|StatementStatistics|TableStatistics)(/.*)?(\?.*)?$
