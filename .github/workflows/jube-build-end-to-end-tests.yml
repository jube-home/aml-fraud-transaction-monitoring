# Proof gate: builds the real Docker images from docker-compose.yml (the same stack a developer runs locally),
# waits for the jube container's own health check to report healthy (its startup applies migrations, so
# "healthy" means the schema is ready), then runs the suite against it - this is the one gate we actually rely
# on before shipping.
#
# The suite runs as two slices, each standing up its own private copy of the stack, in parallel, so the wall
# clock is the slower of the two rather than their sum.
#
# The first slice's filter names every category the suite defines besides PenTest - the AskJooby, AdvancedAnalytics,
# Convention and Reporting categories were once uncovered by any gate, which is exactly the kind of silent hole the
# filter now closes by naming them. A new category must be added here or it does not gate.
#
# The split is about isolation, not speed. A single unfiltered run put the pen test battery - thousands of
# hostile requests, deliberately concurrent - on the same Postgres instance and the same Npgsql pool as the
# Service tests, and the pen test's load starved the Service tests of connections; failures that said nothing
# at all about the code under test. Each slice now gets its own instance and its own pool.
#
# Two, not more, and that is measured rather than assumed: the whole Category=PenTest battery - 6,073 tests, the
# payload corpora exhaustive - runs in under eight minutes in one process pinned to four cores, so sharding it by
# namespace would multiply the nightly's docker and dotnet builds several times over to save nothing. Shard when a
# measurement says to, not before. There is no Load slice: those tests assert function across volume rather than
# throughput, so they carry Category=Service and run in the first slice. Performance belongs in a suite of its
# own, on hardware whose capacity is known, and not in a correctness gate.
#
# timeout-minutes is per slice rather than shared, because the runner's capacity is not something this workflow
# should assume. The values are deliberately generous: a slice that needs an hour is not a problem, a slice
# silently truncated at a guessed ceiling is.
#
# This is the gate on every pull request, and it runs again on the push to master that the merge produces. A pull
# request event builds the merge commit rather than the branch in isolation, so what passes there is post-merge state
# already - but only of the merge as it stood when the run happened, which is why "Require branches to be up to date
# before merging" has to be set in branch protection: without it, two pull requests each green against an older master
# can merge cleanly and still break it. The push run closes the remaining gap by proving the commit that actually
# exists, and it is what the README's badge reports, so the badge describes master rather than the last schedule.
#
# The schedule is weekly rather than nightly, and is no longer guarded by a check for whether master has moved, because
# re-running against an unchanged master is the only thing a schedule can do that the pull request and push runs cannot:
# the stack is built from docker-compose, so the base images, the runner image and the restored package graph all move
# underneath a repository that is standing still, and a week of that drift is worth one run to discover.

name: Jube Build and End-to-End Tests

on:
  schedule:
    - cron: '0 2 * * 0'
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull request run is worth cancelling; a superseded master run is not, because its conclusion is what the
# badge and the history report for that commit, and a cancelled run says nothing about the code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  end-to-end:
    # The check's name is what branch protection requires, and a matrix of several keys would otherwise name it
    # after every value of every key, including the filter expression. Naming it by the slice alone keeps the
    # required check stable and legible.
    name: end-to-end (${{ matrix.slice }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: units-and-services
            timeout: 120
            filter: "Category=Unit|Category=Service|Category=PermissionParity|Category=AskJooby|Category=AdvancedAnalytics|Category=Convention|Category=Reporting"
          - slice: pen-test
            timeout: 120
            filter: "Category=PenTest"

    env:
      DockerComposePostgresPassword: ${{ secrets.DOCKER_COMPOSE_POSTGRES_PASSWORD }}
      DockerComposeJWTKey: ${{ secrets.DOCKER_COMPOSE_JWT_KEY }}
      DockerComposeApiHmacKey: ${{ secrets.DOCKER_COMPOSE_API_HMAC_KEY }}
      DockerComposePasswordHashingKey: ${{ secrets.DOCKER_COMPOSE_PASSWORD_HASHING_KEY }}
      DockerComposeElementSymmetricEncryptionKey: ${{ secrets.DOCKER_COMPOSE_ELEMENT_SYMMETRIC_ENCRYPTION_KEY }}
      # Maximum Pool Size matches the DatabaseFixture's own default rather than undercutting it by five times.
      # xUnit parallelises by test class, several classes stand up a real engine host with a pool of its own,
      # and a pool of 20 is exhausted by the suite's aggregate concurrency rather than by any one test's needs -
      # the symptom being a cascade of "The connection pool has been exhausted" in classes that touch nothing
      # related to whatever is actually broken. docker-compose.yml raises the server's max_connections to match.
      JubeTestConnectionString: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=${{ secrets.DOCKER_COMPOSE_POSTGRES_PASSWORD }};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=100;"
      # The stack's own jube container runs the cache prune server against database 0 of the same Redis, and it
      # deletes payloads, journals and ledgers past a threshold reference date. A test that asserts the cache is
      # exactly as it left it cannot share a keyspace with it, so the suite is given a logical database of its own.
      JubeTestRedisConnectionString: "localhost,defaultDatabase=1"

    steps:
      - uses: actions/checkout@v5

      # The hosted runner offers roughly 14 to 20GB of free disk, and this slice needs more than that on its own:
      # the jube.app image is 2.3GB now that the RAG corpus is embedded in Jube.Migrations, jube.r is another
      # 2.1GB, the pulled bases add 2GB, the in-image restore-build-publish of the whole solution leaves several
      # gigabytes of build cache, the host-side Release build is 4GB more because every output referencing
      # Jube.Migrations carries the corpus-bearing assembly, and the seeded Postgres volume is 1.9GB before the
      # WAL's transient growth. A full disk mid-migration kills Postgres, the app dies with it, and the container
      # sits at "unhealthy" until the wait expires - a failure that reads as a hang and never names the disk.
      # Removing toolchains this workflow never touches reclaims around 20GB for about a minute of runtime.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/ghc /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: docker/setup-buildx-action@v3

      # The jube-r image is built separately, ahead of the compose stack, so its layers can live in the Actions
      # cache between runs: a hosted runner starts with an empty docker layer cache, so compose otherwise rebuilds
      # the R image's package library from nothing on every run, which is minutes of work that only actually
      # changes when something under Jube.R/ does. On an unchanged Jube.R/ the whole build is a cache hit and the
      # image loads in well under a minute; on a change the build runs once and re-primes the cache for both this
      # workflow and the ZAP one, which shares the scope.
      - name: Build the jube-r image with a cross-run layer cache
        uses: docker/build-push-action@v6
        with:
          context: Jube.R
          tags: jube.r
          load: true
          cache-from: type=gha,scope=jube-r
          cache-to: type=gha,scope=jube-r,mode=max

      # The jube-r service is deliberately left out of the build list - its image was just loaded above, and
      # "up" without --build starts services from the images that already exist rather than rebuilding them.
      - name: Start the docker-compose stack
        run: |
          docker compose build jube jube-monitoring jube-otel-listener
          docker compose up -d

      # The images are built and running by this point, so the BuildKit cache - the sdk base, the full in-image
      # restore, build and publish of the solution, the R package compilation - is dead weight on the same disk
      # the seed is about to write two gigabytes into. Pruning it never touches the running containers' images
      # or the jube-r layer cache, which lives in the Actions cache service rather than on this disk.
      - name: Drop the docker build cache
        run: docker builder prune -af && docker buildx prune -af && df -h /

      # The boot applies every migration to a fresh volume, including inserting the 1.2GB RAG corpus into pgvector,
      # and takes ~280 seconds on a fast local NVMe machine - so a ceiling of a few minutes is one the hosted
      # runner's slower disk and CPU cannot meet. Thirty minutes is deliberately far past any plausible healthy
      # boot: the loop exits the moment the container reports healthy, so only a genuinely failed boot ever pays
      # the full wait, and a slow boot that succeeds is strictly better than a fast abort that says nothing. The
      # container showing "unhealthy" mid-wait is the normal case rather than a verdict - the probe hits /api/ready
      # and nothing listens until the migrations finish - so the loop only gives up early when the container has
      # actually stopped, and a failure prints the disk, the container state and the stack logs so the run says
      # which of slow-boot, crash and full-disk it was.
      - name: Wait for jube to become healthy
        run: |
          for i in $(seq 1 360); do
            status=$(docker inspect --format '{{.State.Health.Status}}' jube 2>/dev/null || echo "starting")
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' jube 2>/dev/null)" = "false" ]; then
              echo "the jube container has stopped"
              break
            fi
            sleep 5
          done
          echo "jube did not become healthy"
          df -h /
          docker inspect --format '{{json .State}}' jube || true
          docker compose logs
          exit 1

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run the ${{ matrix.slice }} slice
        id: first_run
        continue-on-error: true
        run: >
          dotnet test --no-build -c Release
          --filter "${{ matrix.filter }}"
          --logger "trx;LogFileName=first-run.trx"
          --results-directory ./TestResults

      - name: Extract failed test names
        if: steps.first_run.outcome == 'failure'
        id: failures
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          # Resolve each failed result's *class + method* via TestDefinitions rather than parsing the
          # display name directly - an xUnit Theory's display name has its data row appended in a shape
          # ("Method(value: \"x\")") that a --filter FullyQualifiedName= expression can't safely embed.
          # Falling back to the bare method here reruns every row of a flaky Theory, not just the one
          # row that failed, which is a fine trade for reliability.
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          tree = ET.parse("TestResults/first-run.trx")
          root = tree.getroot()

          methods_by_id = {}
          for unit_test in root.findall(".//t:TestDefinitions/t:UnitTest", ns):
              test_method = unit_test.find("t:TestMethod", ns)
              if test_method is None:
                  continue
              class_name = test_method.get("className")
              method_name = test_method.get("name")
              if class_name and method_name:
                  methods_by_id[unit_test.get("id")] = f"{class_name}.{method_name}"

          names = sorted({
              methods_by_id[r.get("testId")]
              for r in root.findall(".//t:UnitTestResult", ns)
              if r.get("outcome") == "Failed" and r.get("testId") in methods_by_id
          })
          with open("failed_tests.txt", "w") as f:
              f.write("\n".join(names))
          print(f"{len(names)} failed test method(s) on the first run.")

          # The count is written here rather than measured from the file, because the file holds the names newline
          # separated with no trailing newline and "wc -l" therefore counted one fewer than it holds: a single failed
          # test counted as none, which skipped the retry and failed the run on the guard meant for a first run that
          # died without recording a test result at all.
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"failed_count={len(names)}\n")
          PY

      - name: Retry only the tests that failed
        if: steps.first_run.outcome == 'failure' && steps.failures.outputs.failed_count != '0'
        run: |
          filter=$(awk 'NR>1{printf "|"} {printf "FullyQualifiedName=%s", $0}' failed_tests.txt)
          echo "Retrying: $filter"
          dotnet test --no-build -c Release --filter "$filter" \
            --logger "trx;LogFileName=retry-run.trx" --results-directory ./TestResults

      - name: Fail the build if the first run failed for a reason other than a listed test failure
        if: steps.first_run.outcome == 'failure' && steps.failures.outputs.failed_count == '0'
        run: exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.slice }}
          path: TestResults/*.trx
          retention-days: 14

      # Captured unconditionally rather than behind failure(): the first run is continue-on-error, so a slice
      # that only went green on the retry leaves no failure() step behind at all, and the stack logs explaining
      # what the first run actually hit are exactly what the next iteration of this pipeline needs to read.
      - name: Capture the docker-compose logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt 2>&1 || true

      - name: Upload the docker-compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ matrix.slice }}
          path: compose-logs.txt
          retention-days: 14

      - name: Stop the docker-compose stack
        if: always()
        run: docker compose down -v
