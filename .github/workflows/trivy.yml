name: Trivy Container Scan

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check whether master has moved since the last successful run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - always executing regardless of whether master has moved."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha=$(gh api "repos/${{ github.repository }}/actions/workflows/trivy.yml/runs?branch=master&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          echo "Last successful run was at commit ${last_sha:-<none>}; current master HEAD is ${{ github.sha }}"

          if [ "$last_sha" = "${{ github.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  container-scan:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jube.app
            dockerfile: Jube.App/Dockerfile
            context: .
          - name: jube.monitoring
            dockerfile: Jube.Monitoring/Dockerfile
            context: .
          - name: jube.opentelemetrylistener
            dockerfile: Jube.OpenTelemetryListener/Dockerfile
            context: .
          - name: jube.etcd
            dockerfile: Jube.Cluster/etcd/Dockerfile
            context: Jube.Cluster/etcd
          - name: jube.patroni
            dockerfile: Jube.Cluster/patroni/Dockerfile
            context: Jube.Cluster/patroni

    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.name }}
        run: docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.name }}:scan" "${{ matrix.context }}"

      - name: Scan ${{ matrix.name }} and report to code scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Upload ${{ matrix.name }} SARIF
        if: ${{ !cancelled() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Fail on fixable CRITICAL vulnerabilities in ${{ matrix.name }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.name }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
