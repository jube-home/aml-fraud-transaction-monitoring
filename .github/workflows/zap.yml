name: OWASP ZAP API Scan

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check whether master has moved since the last successful run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - always executing regardless of whether master has moved."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha=$(gh api "repos/${{ github.repository }}/actions/workflows/zap.yml/runs?branch=master&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          echo "Last successful run was at commit ${last_sha:-<none>}; current master HEAD is ${{ github.sha }}"

          if [ "$last_sha" = "${{ github.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  dast-zap:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DockerComposePostgresPassword: ${{ secrets.DOCKER_COMPOSE_POSTGRES_PASSWORD }}
      DockerComposeJWTKey: ${{ secrets.DOCKER_COMPOSE_JWT_KEY }}
      DockerComposeApiHmacKey: ${{ secrets.DOCKER_COMPOSE_API_HMAC_KEY }}
      DockerComposePasswordHashingKey: ${{ secrets.DOCKER_COMPOSE_PASSWORD_HASHING_KEY }}
      DockerComposeElementSymmetricEncryptionKey: ${{ secrets.DOCKER_COMPOSE_ELEMENT_SYMMETRIC_ENCRYPTION_KEY }}
      BaseUrl: http://localhost:5001

    steps:
      - uses: actions/checkout@v4

      - name: Start the docker-compose stack
        run: docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml up -d --build

      - name: Wait for jube to become healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' jube 2>/dev/null || echo "starting")
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "jube did not become healthy in time"
          docker compose logs
          exit 1

      - name: Authenticate as the seeded administrator
        run: |
          set -euo pipefail

          new_password=""
          for _ in $(seq 1 20); do
            candidate="Zap!$(openssl rand -hex 8)Aa9"
            if ! printf '%s' "$candidate" | grep -qE '(.)\1{2,}'; then
              new_password="$candidate"
              break
            fi
          done
          if [ -z "$new_password" ]; then
            echo "Could not generate a password satisfying the strength rules"
            exit 1
          fi
          echo "::add-mask::$new_password"

          code=$(curl -sS -o login.json -w '%{http_code}' -c cookies.txt \
            -H 'Content-Type: application/json' \
            -X POST "$BaseUrl/api/Authentication/ByUserNamePassword" \
            -d "{\"UserName\":\"Administrator\",\"Password\":\"Administrator\",\"NewPassword\":\"$new_password\",\"RepeatNewPassword\":\"$new_password\"}")

          if [ "$code" != "200" ]; then
            echo "Login returned HTTP $code"
            cat login.json
            exit 1
          fi

          jwt=$(awk '$6 == "authentication-jwt" { print $7 }' cookies.txt)
          if [ -z "$jwt" ]; then
            echo "Login succeeded but no authentication-jwt cookie was issued"
            exit 1
          fi
          echo "::add-mask::$jwt"

      - name: Provision a dedicated scan identity and mint its API key
        run: python3 .github/zap/scan-credentials.py provision

      - name: Order the live OpenAPI document into ordered scan passes
        id: passes
        run: |
          set -euo pipefail

          curl -sS -f -b cookies.txt -o swagger.json "$BaseUrl/swagger/v1/swagger.json"

          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          methods = {"get", "put", "post", "delete", "options", "head", "patch", "trace"}

          authentication_prefix = "/api/Authentication"

          self_curtailing = [
              (re.compile(r"^/api/UserRegistry/SetPassword$", re.IGNORECASE), {"post"}),
              (re.compile(r"^/api/UserRegistry/RevokeTokens(/\{[^}]+\})?$", re.IGNORECASE), {"post"}),
              (re.compile(r"^/api/UserRegistry/\{[^}]+\}$", re.IGNORECASE), {"delete"}),
              (re.compile(r"^/api/UserRegistryApiKey/\{[^}]+\}$", re.IGNORECASE), {"delete"}),
          ]

          with open("swagger.json") as handle:
              document = json.load(handle)

          paths = document.get("paths", {})
          if not paths:
              print("The OpenAPI document declares no paths - nothing to scan.")
              sys.exit(1)

          application, administration, authentication = {}, {}, {}

          def assign(store, path, item, operations):
              entry = store.setdefault(
                  path, {k: v for k, v in item.items() if k.lower() not in methods})
              for operation in operations:
                  entry[operation] = item[operation]

          offered = 0
          for path, item in paths.items():
              operations = [k for k in item if k.lower() in methods]
              offered += len(operations)

              if not operations:
                  assign(application, path, item, operations)
                  continue

              if path.startswith(authentication_prefix):
                  assign(authentication, path, item, operations)
                  continue

              curtailing = {operation for pattern, applies_to in self_curtailing
                            if pattern.match(path)
                            for operation in operations if operation.lower() in applies_to}

              if curtailing:
                  assign(administration, path, item, sorted(curtailing))

              remaining = [k for k in operations if k not in curtailing]
              if remaining:
                  assign(application, path, item, remaining)

          def write(name, phase_paths):
              phase = dict(document)
              phase["paths"] = phase_paths
              phase["servers"] = [{"url": os.environ["BaseUrl"]}]
              with open(name, "w") as handle:
                  json.dump(phase, handle)
              return sum(len([k for k in item if k.lower() in methods])
                         for item in phase_paths.values())

          passes = [
              ("1", "application", "zap-openapi-1-application.json", application),
              ("2", "administration", "zap-openapi-2-administration.json", administration),
              ("3", "authentication", "zap-openapi-3-authentication.json", authentication),
          ]

          scanned = 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for ordinal, name, filename, phase_paths in passes:
                  count = write(filename, phase_paths)
                  scanned += count
                  print(f"Pass {ordinal} ({name}): {len(phase_paths)} paths, {count} operations")
                  print(f"pass{ordinal}={'true' if count else 'false'}", file=output)

          if scanned != offered:
              sys.exit(f"The passes cover {scanned} of the {offered} operations the document "
                       f"offers - refusing to scan an incomplete surface.")

          print(f"All {offered} operations across {len(paths)} paths are covered, none excluded.")
          PY

      - name: ZAP API scan, pass 1 of 4 - application surface
        if: steps.passes.outputs.pass1 == 'true'
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: zap-openapi-1-application.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-scan-report-1-application
          cmd_options: '-z "-configfile /zap/wrk/zap-auth.conf"'

      - name: ZAP API scan, pass 2 of 4 - user and credential administration
        if: steps.passes.outputs.pass2 == 'true'
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: zap-openapi-2-administration.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-scan-report-2-administration
          cmd_options: '-z "-configfile /zap/wrk/zap-auth.conf"'

      - name: Report whether the scan credential survived pass 2
        if: always() && steps.passes.outputs.pass2 == 'true'
        run: |
          set -uo pipefail

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "X-API-KEY: $(sed -n 's/^replacer\.full_list(0)\.replacement=//p' zap-auth.conf)" \
            "$BaseUrl/api/UserRegistry" || echo 000)

          if [ "$code" = "200" ]; then
            echo "The scan credential is still live after pass 2; pass 3 runs authenticated."
          else
            echo "::warning::Pass 2 invalidated the scan credential (probe returned HTTP $code). Pass 3 will run against the authentication surface unauthenticated, which is that surface's real threat model, but Logout will not be reached."
          fi

      - name: ZAP API scan, pass 3 of 4 - authentication surface, API key credential
        if: steps.passes.outputs.pass3 == 'true'
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: zap-openapi-3-authentication.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-scan-report-3-authentication-apikey
          cmd_options: '-z "-configfile /zap/wrk/zap-auth.conf"'

      - name: Mint a fresh session cookie for the browser-facing pass
        id: cookie
        if: steps.passes.outputs.pass3 == 'true'
        run: python3 .github/zap/scan-credentials.py cookie

      - name: ZAP API scan, pass 4 of 4 - authentication surface, session cookie credential
        if: steps.passes.outputs.pass3 == 'true' && steps.cookie.outputs.ready == 'true'
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: zap-openapi-3-authentication.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-scan-report-4-authentication-cookie
          cmd_options: '-z "-configfile /zap/wrk/zap-auth-cookie.conf"'

      - name: Show docker-compose logs
        if: failure()
        run: docker compose logs

      - name: Stop the docker-compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f .github/zap/docker-compose.zap.yml down -v
