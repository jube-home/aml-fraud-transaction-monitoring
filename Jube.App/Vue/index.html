<!doctype html>
<html lang="en-GB" data-theme="jube">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Jube</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <link rel="stylesheet" href="/css/jube-charting.css"/>
    <style>
        #boot-status{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:14px system-ui,sans-serif;color:#555;background:#fff}
        #boot-status .bar{width:160px;height:2px;background:#ddd;overflow:hidden}
        #boot-status .bar::after{content:"";display:block;width:40%;height:100%;background:#888;animation:boot-slide 1.1s ease-in-out infinite}
        @keyframes boot-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
        @media (prefers-color-scheme:dark){#boot-status{color:#aaa;background:#111}#boot-status .bar{background:#333}#boot-status .bar::after{background:#999}}
    </style>
</head>
<body>
<div id="app"></div>
<div id="boot-status" role="status" aria-live="polite">
    <span>Loading client application artifacts&hellip;</span>
    <div class="bar"></div>
</div>
<script>
    addEventListener('error', function (e) {
        if (!e.target || e.target.tagName !== 'SCRIPT') return;
        var key = 'jube.boot-retry', now = Date.now(), last = 0;
        try { last = Number(sessionStorage.getItem(key)) || 0; } catch (x) {}
        if (now - last > 60000) {
            try { sessionStorage.setItem(key, String(now)); } catch (x) {}
            location.reload();
            return;
        }
        var s = document.querySelector('#boot-status span');
        if (s) s.textContent = 'The client application failed to load. Check your connection and reload.';
    }, true);
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
