{ { - if .Values.r.enabled } }
apiVersion: apps/v1
kind: Deployment
metadata:
  name: { { include "jube.fullname" . } }-r
  labels:
    {{- include "jube.labels" . | nindent 4 }}
    app.kubernetes.io/component: r
spec:
  replicas: { { .Values.r.replicas } }
  selector:
    matchLabels:
      app.kubernetes.io/name: jube
      app.kubernetes.io/instance: { { .Release.Name } }
      app.kubernetes.io/component: r
  template:
    metadata:
      labels:
        { { - include "jube.labels" . | nindent 8 } }
        app.kubernetes.io/component: r
    spec:
      automountServiceAccountToken: false
      { { - with .Values.imagePullSecrets } }
      imagePullSecrets:
        { { - toYaml . | nindent 8 } }
      { { - end } }
      containers:
        - name: r
          image: { { .Values.r.image } }
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          { { - with .Values.r.resources } }
          resources:
            { { - toYaml . | nindent 12 } }
          { { - end } }
      volumes:
        - name: tmp
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: jube-r
  labels:
    { { - include "jube.labels" . | nindent 4 } }
    app.kubernetes.io/component: r
spec:
  selector:
    app.kubernetes.io/name: jube
    app.kubernetes.io/instance: { { .Release.Name } }
    app.kubernetes.io/component: r
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: { { include "jube.fullname" . } }-r
  labels:
    {{- include "jube.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jube
      app.kubernetes.io/instance: { { .Release.Name } }
      app.kubernetes.io/component: r
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jube
              app.kubernetes.io/instance: { { .Release.Name } }
  egress: [ ]
  { { - end } }
