services:
  jube:
    image: jube.app
    container_name: "jube"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - ApiHmacKey=MyLocalSecretKey123!
      - JWTKey=MyLocalJWTKey123!ForTestingPurposes
      - EnablePublicInvokeController=True
      - ConnectionString=Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=$DockerComposePostgresPassword;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=100;
      - ReportConnectionString=Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=$DockerComposePostgresPassword;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=100;
      - EnableSandbox=True
      - JWTKey=$DockerComposeJWTKey
      - ApiHmacKey=$DockerComposeApiHmacKey
      - JempFileLegacyEncryptionFallback=True
      - RedisConnectionString=redis
      - EnableExhaustiveTraining=True
      - Landlord=True
      - EnableReprocessing=True
      - EnableSanctionLoader=False
      - CachePruneServer=True
      - EnableTtlCounter=True
      - EnableSearchKeyCache=True
      - EnableCasesAutomation=True
      - StreamingActivationWatcher=True
      - EnableCallback=True
      - EnablePublicInvokeController=True
      - PasswordHashingKey=$DockerComposePasswordHashingKey
      - EnableMigration=True
      - Log4NetLogLevel=ERROR
      - ElementSymmetricEncryptionKey=$DockerComposeElementSymmetricEncryptionKey
      - LocalCache=True
      - DOTNET_gcServer=1
      - DOTNET_gcConcurrent=1
      - DOTNET_GCConserveMemory=4
      - DOTNET_GCDynamicAdaptationMode=1
      - EnableOpenTelemetry=False
      - OpenTelemetryBackendEndpoint=http://jube-otel-listener:4318
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    links:
      - redis
      - postgres
    ports:
      - "5001:5001"
    networks:
      - default
    build:
      context: .
      dockerfile: Jube.App/Dockerfile

  jube-monitoring:
    image: jube.monitoring
    container_name: "jube-monitoring"
    depends_on:
      postgres:
        condition: service_started
    environment:
      - ConnectionString=Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=$DockerComposePostgresPassword;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=5;
      - DockerSocketPath=/var/run/docker.sock
      - SampleIntervalSeconds=60
      - EnableOpenTelemetry=False
      - OpenTelemetryBackendEndpoint=http://jube-otel-listener:4318
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    build:
      context: .
      dockerfile: Jube.Monitoring/Dockerfile

  jube-otel-listener:
    image: jube.opentelemetrylistener
    container_name: "jube-otel-listener"
    networks:
      - default
    build:
      context: .
      dockerfile: Jube.OpenTelemetryListener/Dockerfile

  postgres:
    image: pgvector/pgvector:pg17
    container_name: "postgres"
    environment:
      - POSTGRES_PASSWORD=$DockerComposePostgresPassword
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - default

  redis:
    image: redis/redis-stack:latest
    container_name: "redis"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis:/data
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  postgres:
    external: false
  redis:
    external: false