        max_attempts: 10
        window: 120s

  garnet4:
    image: ghcr.io/microsoft/garnet:latest@sha256:f420f566c08c04cf89a6de05f158fa3000c5505c9edeb344aac5c034fc78a9e3
    hostname: garnet4
    secrets:
      - RESP_PASSWORD
    entrypoint:
      - sh
      - -c
      - |
        PASS=$$(cat /run/secrets/RESP_PASSWORD)
        exec /app/GarnetServer \
          --port 6379 --bind 0.0.0.0 \
          --cluster --cluster-timeout 5 \
          --cluster-announce-hostname garnet4 --cluster-preferred-endpoint-type hostname \
          --auth Password --password "$$PASS" --cluster-username default --cluster-password "$$PASS" \
          --checkpointdir /data --aof --aof-commit-freq 1000 --recover
    volumes:
      - garnet4-data:/data
    networks:
      jube-cluster:
        aliases:
