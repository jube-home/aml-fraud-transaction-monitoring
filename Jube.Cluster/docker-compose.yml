      - ./patroni/patroni4.yml:/etc/patroni.yml:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - /mnt/pgbackrest:/var/lib/pgbackrest
      - patroni4_runtime:/var/run/postgresql
      - patroni4_tmp:/var/lib/postgresql/tmp
    tmpfs:
