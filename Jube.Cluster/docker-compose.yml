    external: true
  PATRONI_ETCD3_PASSWORD:
    external: true
  JUBE_APP_PASSWORD:
    external: true
  JUBE_REPORTING_PASSWORD:
    external: true
  JUBE_MIGRATION_PASSWORD:
    external: true
  JUBE_PURGE_PASSWORD:
