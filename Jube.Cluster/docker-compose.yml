    networks:
      jube-cluster:
        aliases:
          - patroni4
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_4
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 10
        window: 3600s
  
  haproxy:
    hostname: haproxy
    image: haproxy:2.8
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - target: 7000
        published: 7000
        protocol: tcp
        mode: host
      - target: 5002
        published: 5002
        protocol: tcp
        mode: host
      - target: 5001
        published: 5001
        protocol: tcp
        mode: host
    networks:
      jube-cluster:
        aliases:
          - haproxy
    deploy:
      #      placement:
      #        constraints:
      #          - node.labels.zone != $CRITICAL_HOST_TIEBREAKER
      mode: global
      restart_policy:
        condition: on-failure
        delay: 15s
  
  # Garnet cluster (one shard: garnet1 primary owning all 16384 slots, garnet2-4 replicas). Replaces the Redis
  # master/replicas + five Sentinels of docker-compose.yml. Membership and failure detection are Garnet's
  # Redis-Cluster-style gossip; garnet-cluster-manager below does the bootstrap and the promotion that Garnet's
  # gossip deliberately does not do itself. garnet1 keeps the NAS-backed volume (uid 999 owns /mnt/garnet).
  garnet1:
    image: ghcr.io/microsoft/garnet:latest@sha256:f420f566c08c04cf89a6de05f158fa3000c5505c9edeb344aac5c034fc78a9e3
    hostname: garnet1
    user: "999"
    secrets:
      - RESP_PASSWORD
    entrypoint:
      - sh
      - -c
      - |
        PASS=$$(cat /run/secrets/RESP_PASSWORD)
        exec /app/GarnetServer \
          --port 6379 --bind 0.0.0.0 \
          --cluster --cluster-timeout 5 \
          --cluster-announce-hostname garnet1 --cluster-preferred-endpoint-type hostname \
          --auth Password --password "$$PASS" --cluster-username default --cluster-password "$$PASS" \
          --checkpointdir /data --aof --aof-commit-freq 1000 --recover
    volumes:
      - /mnt/garnet:/data
    networks:
      jube-cluster:
        aliases:
          - garnet1
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_1
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 10
        window: 120s

  garnet2:
    image: ghcr.io/microsoft/garnet:latest@sha256:f420f566c08c04cf89a6de05f158fa3000c5505c9edeb344aac5c034fc78a9e3
    hostname: garnet2
    secrets:
      - RESP_PASSWORD
    entrypoint:
