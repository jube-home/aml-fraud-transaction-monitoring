        window: 120s

  garnet-cluster-manager:
    image: redis:7-alpine
    secrets:
      - RESP_PASSWORD
    command: [ "sh", "/cluster-manager.sh" ]
    volumes:
      - ./garnet/cluster-manager.sh:/cluster-manager.sh:ro
    networks:
      - jube-cluster
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_TIEBREAKER
      restart_policy:
        condition: any
        delay: 5s

  jube-ui:
    image: ${JUBE_IMAGE}
    secrets:
      - ASK_JOOBY_API_KEY
      - JUBE_APP_PASSWORD
      - JUBE_REPORTING_PASSWORD
      - JUBE_MIGRATION_PASSWORD
      - JWT_KEY
      - PASSWORD_HASHING_KEY
      - CASE_SIMILARITY_HASHING_KEY
      - RESP_PASSWORD
      - API_HMAC_KEY
      - PASSWORD_ASYMMETRIC_ENCRYPTION_PRIVATE_KEY
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - EnableMockEndpoints=False
      - ConnectionString=Host=haproxy;Port=5432;Database=postgres;Username=jube_app;Password=[@JUBE_APP_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      # Port 5433, not 5432 - HAProxy's postgres_replicas backend (see haproxy.cfg), routing reporting/read
      # queries to a Patroni replica instead of the primary.
      - ReportConnectionString=Host=haproxy;Port=5433;Database=postgres;Username=jube_reporting;Password=[@JUBE_REPORTING_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      - EnableSandbox=False
      - JWTKey=[@JWT_KEY@]
      - ApiHmacKey=[@API_HMAC_KEY@]
      - PasswordAsymmetricEncryption=True
      - PasswordAsymmetricEncryptionPrivateKey=[@PASSWORD_ASYMMETRIC_ENCRYPTION_PRIVATE_KEY@]
      # Only the private key flows through Docker secrets/[@Key@] tokenisation like the values above - the
      # public key isn't sensitive, so secrets-init.sh just prints it once for a manual paste here instead
      # of provisioning a secret for it. Required whenever PasswordAsymmetricEncryption=True: Jube refuses
      # to start with RSA password encryption enabled and either key missing.
      - PasswordAsymmetricEncryptionPublicKey=CHANGE-ME-paste-public-key-printed-by-secrets-init.sh
      - RespConnectionString=garnet1:6379,garnet2:6379,garnet3:6379,garnet4:6379,password=[@RESP_PASSWORD@],abortConnect=false,syncTimeout=8000,connectTimeout=10000,keepAlive=60
      # ExponentialRetry(base, max) for SE.Redis's background reconnect attempts after the physical connection
      # drops - how fast it retries, not how long an in-flight command waits. SE.Redis doesn't expose the growth
      # rate itself (it's a fixed ~2x-per-attempt curve internally) - the only levers are the floor and the
      # ceiling, so lowered from 100/3000 to keep retries frequent on a brittle WAN link instead of settling into
      # a multi-second gap between attempts once the curve saturates.
      - RespReconnectRetryBaseDelay=50
      - RespReconnectRetryMaxDelay=500
      # True: commands issued while disconnected fail immediately once the connection is known unhealthy, instead
      # of queuing until they hit their own syncTimeout above - the mechanism that used to hold transactions for a
      # long period during a genuine network break. Chosen over the (default False) queue-and-wait behaviour for
      # the same brittle-WAN reasoning as the retry cadence above - fail fast and let the caller's own retry/
      # fallback handle it, rather than blocking on a connection that may not come back soon.
      - RespBacklogFailFast=True
      - EnableExhaustiveTraining=False
      - Landlord=False
      - EnableReprocessing=False
      - EnableAskJooby=${EnableAskJooby}
      - AskJoobyApiKey=[@ASK_JOOBY_API_KEY@]
      - EnableSanctionLoader=False
      - CachePruneServer=False
      - EnableTtlCounter=False
      - EnableSearchKeyCache=False
      - EnableCasesAutomation=False
      - PasswordHashingKey=[@PASSWORD_HASHING_KEY@]
      - CaseSimilarityHashingKey=[@CASE_SIMILARITY_HASHING_KEY@]
      - EnableMigration=False
      # jube-ui never runs the rules engine or entity model - it's the presentation layer only, so unlike
      # jube-api/jube-jobs below it also has no ElementSymmetricEncryptionKey secret/env var: that key only
      # matters to Inline Scripts' AES helper, which can only ever run where EnableEngine/EnableEntityModel is
      # True.
      - EnableEngine=False
      - EnableEntityModel=False
      - LocalCache=False
      - LocalCacheBytes=0
      - LocalCacheFill=False
      - RespPublishSubscribeEvents=False
      - RespBackplane=True
      - EnablePublicInvokeController=False
      - Log4NetLogLevel=INFO
      - DOTNET_GC_SERVER=1
      - SecretsPath=/run/secrets/
      - NegotiateAuthentication=False
      - KRB5_CONFIG=/etc/krb5.conf
      - KRB5_KTNAME=FILE:/etc/krb5.keytab
      - KRB5RCACHETYPE=none
      # Uncomment for Kerberos/GSSAPI diagnostics during go-live. Writes the full
      # negotiation (keytab selection, KDC traffic, enctypes) to stderr, which lands
      # in `docker service logs`. Verbose and logs principal names - disable after.
      # - KRB5_TRACE=/dev/stderr
      - JWTValidIssuer=https://CHANGE-ME.yourcorp.com
      - JWTValidAudience=https://CHANGE-ME.yourcorp.com
      # Off by default here - uncomment both to push this service's OpenTelemetry data at the
      # jube-otel-listener sidecar below (a throwaway local receiver for manual testing, not a real
      # collector - see Jube.OpenTelemetryListener/Program.cs). Also requires EnableOpenTelemetry=True.
      - EnableOpenTelemetry=True
      - OpenTelemetryBackendEndpoint=http://jube-otel-listener:4318
    networks:
      jube-cluster:
        aliases:
          - jube-ui
    volumes:
      - ./krb5/krb5.conf:/etc/krb5.conf:ro
      - ./krb5/jube.keytab:/etc/krb5.keytab:ro
    deploy:
      #      placement:
      #        max_replicas_per_node: 1
      #        constraints:
      #          - node.labels.zone != $CRITICAL_HOST_TIEBREAKER
      # replicas: 0 here (and on jube-api) deliberately - both are scaled up manually only after jube-jobs has
      # run its database migration (EnableMigration=True there, see jube-jobs below), so a fresh deployment
      # can never race the application tier against an unmigrated schema.
      replicas: 0
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 120s
        order: stop-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
      rollback_config:
        parallelism: 1
        delay: 60s
        order: stop-first
        failure_action: continue
  
  jube-api:
    image: ${JUBE_IMAGE}
    secrets:
      - ASK_JOOBY_API_KEY
      - JUBE_APP_PASSWORD
      - JUBE_REPORTING_PASSWORD
      - JUBE_MIGRATION_PASSWORD
      - JWT_KEY
      - PASSWORD_HASHING_KEY
      - CASE_SIMILARITY_HASHING_KEY
      - RESP_PASSWORD
      - API_HMAC_KEY
      - ENCRYPTION_KEY
      - PASSWORD_ASYMMETRIC_ENCRYPTION_PRIVATE_KEY
      - PATRONI_ETCD3_PASSWORD
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - EnableMockEndpoints=False
      # Reuses the same scoped credential Patroni authenticates to etcd with (see etcd1's secrets
      # above). Needed on every service running the engine (EnableEngine=True below), since that is
      # what polls etcd member/health status and Patroni's DCS history key for the Infrastructure
      # Health Metrics pages - jube-jobs below carries the same pair for the same reason. Without it
      # those two samplers poll unauthenticated and, since etcd client auth is mandatory here, simply
      # record nothing.
      - EtcdClientUsername=patroni
      - EtcdClientPassword=[@PATRONI_ETCD3_PASSWORD@]
      - ConnectionString=Host=haproxy;Port=5432;Database=postgres;Username=jube_app;Password=[@JUBE_APP_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      # Port 5433, not 5432 - HAProxy's postgres_replicas backend (see haproxy.cfg), routing reporting/read
      # queries to a Patroni replica instead of the primary.
      - ReportConnectionString=Host=haproxy;Port=5433;Database=postgres;Username=jube_reporting;Password=[@JUBE_REPORTING_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      - EnableSandbox=False
      - JWTKey=[@JWT_KEY@]
      - ApiHmacKey=[@API_HMAC_KEY@]
      - ElementSymmetricEncryptionKey=[@ENCRYPTION_KEY@]
      - PasswordAsymmetricEncryption=True
      - PasswordAsymmetricEncryptionPrivateKey=[@PASSWORD_ASYMMETRIC_ENCRYPTION_PRIVATE_KEY@]
      # Only the private key flows through Docker secrets/[@Key@] tokenisation like the values above - the
      # public key isn't sensitive, so secrets-init.sh just prints it once for a manual paste here instead
      # of provisioning a secret for it. Required whenever PasswordAsymmetricEncryption=True: Jube refuses
      # to start with RSA password encryption enabled and either key missing.
      - PasswordAsymmetricEncryptionPublicKey=CHANGE-ME-paste-public-key-printed-by-secrets-init.sh
      - RespConnectionString=garnet1:6379,garnet2:6379,garnet3:6379,garnet4:6379,password=[@RESP_PASSWORD@],abortConnect=false,syncTimeout=8000,connectTimeout=10000,keepAlive=60
      # ExponentialRetry(base, max) for SE.Redis's background reconnect attempts after the physical connection
      # drops - how fast it retries, not how long an in-flight command waits. SE.Redis doesn't expose the growth
      # rate itself (it's a fixed ~2x-per-attempt curve internally) - the only levers are the floor and the
      # ceiling, so lowered from 100/3000 to keep retries frequent on a brittle WAN link instead of settling into
      # a multi-second gap between attempts once the curve saturates.
      - RespReconnectRetryBaseDelay=50
      - RespReconnectRetryMaxDelay=500
      # True: commands issued while disconnected fail immediately once the connection is known unhealthy, instead
      # of queuing until they hit their own syncTimeout above - the mechanism that used to hold transactions for a
      # long period during a genuine network break. Chosen over the (default False) queue-and-wait behaviour for
      # the same brittle-WAN reasoning as the retry cadence above - fail fast and let the caller's own retry/
      # fallback handle it, rather than blocking on a connection that may not come back soon.
      - RespBacklogFailFast=True
      - EnableExhaustiveTraining=False
      - Landlord=True
      - EnableReprocessing=False
      - EnableAskJooby=${EnableAskJooby}
      - AskJoobyApiKey=[@ASK_JOOBY_API_KEY@]
      - EnableSanctionLoader=False
      - CachePruneServer=False
      - EnableTtlCounter=False
      - EnableSearchKeyCache=False
      - EnableCasesAutomation=False
      - PasswordHashingKey=[@PASSWORD_HASHING_KEY@]
      - CaseSimilarityHashingKey=[@CASE_SIMILARITY_HASHING_KEY@]
      - EnableMigration=False
      - EnableEngine=True
      - LocalCache=True
      - LocalCacheBytes=4294967296
      - LocalCacheFill=False
      - RespPublishSubscribeEvents=True
      - EnableEntityModel=True
      - EnablePublicInvokeController=True
      # Points AskJooby's sandboxed-R-script tool (RunScript, gated separately by EnableAskJoobyR plus the
      # per-caller SandboxedScriptExecution permission) at the jube-r service below by its compose service
      # name and internal port. jube-jobs doesn't carry this: it has no haproxy frontend of its own (see
      # haproxy.cfg), so it never serves the AskJooby HTTP endpoints that reach this tool.
      - RServerUrl=http://jube-r:8080
      - Log4NetLogLevel=WARN
      - ActivationWatcherBulkCopyThresholdjube-=20
      - ArchiverPersistThreads=4
      - BulkCopyThreshold=20
      - DOTNET_GC_SERVER=1
      - SecretsPath=/run/secrets/
      - NegotiateAuthentication=False
      - KRB5_CONFIG=/etc/krb5.conf
      - KRB5_KTNAME=FILE:/etc/krb5.keytab
      - KRB5RCACHETYPE=none
      # Uncomment for Kerberos/GSSAPI diagnostics during go-live. Writes the full
      # negotiation (keytab selection, KDC traffic, enctypes) to stderr, which lands
      # in `docker service logs`. Verbose and logs principal names - disable after.
      # - KRB5_TRACE=/dev/stderr
      - JWTValidIssuer=https://CHANGE-ME.yourcorp.com
      - JWTValidAudience=https://CHANGE-ME.yourcorp.com
      # Off by default here - uncomment both to push this service's OpenTelemetry data at the
      # jube-otel-listener sidecar below (a throwaway local receiver for manual testing, not a real
      # collector - see Jube.OpenTelemetryListener/Program.cs). Also requires EnableOpenTelemetry=True.
      - EnableOpenTelemetry=False
      - OpenTelemetryBackendEndpoint=http://jube-otel-listener:4318
    networks:
      jube-cluster:
        aliases:
          - jube-api
      rsandbox: { }
    volumes:
      - ./krb5/krb5.conf:/etc/krb5.conf:ro
      - ./krb5/jube.keytab:/etc/krb5.keytab:ro
    deploy:
      #      placement:
      #        max_replicas_per_node: 1
      #        constraints:
      #          - node.labels.zone != $CRITICAL_HOST_TIEBREAKER
      # Same replicas: 0 / manual-scale-up-after-migration reasoning as jube-ui above.
      replicas: 0
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 120s
        order: stop-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
      rollback_config:
        parallelism: 1
        delay: 60s
        order: stop-first
        monitor: 30s
        failure_action: continue

  jube-jobs:
    image: ${JUBE_IMAGE}
    secrets:
      - ASK_JOOBY_API_KEY
      - JUBE_APP_PASSWORD
      - JUBE_REPORTING_PASSWORD
      - JUBE_MIGRATION_PASSWORD
      - JUBE_PURGE_PASSWORD
      - JWT_KEY
      - PASSWORD_HASHING_KEY
      - RESP_PASSWORD
      - ENCRYPTION_KEY
      - CASE_SIMILARITY_HASHING_KEY
      - PATRONI_ETCD3_PASSWORD
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - EnableMockEndpoints=False
      # Reuses the same scoped credential Patroni authenticates to etcd with (see etcd1's secrets
      # above), polling member/health status and Patroni's DCS history key for the Infrastructure
      # Health Metrics pages - the same pair jube-api above needs, and for the same reason.
      - EtcdClientUsername=patroni
      - EtcdClientPassword=[@PATRONI_ETCD3_PASSWORD@]
      - ConnectionString=Host=haproxy;Port=5432;Database=postgres;Username=jube_app;Password=[@JUBE_APP_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      - ReportConnectionString=Host=haproxy;Port=5433;Database=postgres;Username=jube_reporting;Password=[@JUBE_REPORTING_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      - MigrationConnectionString=Host=haproxy;Port=5432;Database=postgres;Username=jube_migration;Password=[@JUBE_MIGRATION_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      # jube_purge only has SELECT/DELETE on the fixed set of infrastructure-health-metric tables that
      # InfrastructureHealthMetricsPurgeStarter chunk-deletes from (see database.sh) - jube_app itself has
      # no DELETE grant at all, which is what turned a routine purge cycle into the permission-denied/
      # connection-leak pair this was added to fix. Falls back to ConnectionString (PurgeConnectionString
      # unset) so this isn't a breaking change for a cluster that hasn't provisioned jube_purge yet.
      - PurgeConnectionString=Host=haproxy;Port=5432;Database=postgres;Username=jube_purge;Password=[@JUBE_PURGE_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      # Explicit off switch (default True) - set False until jube_purge has actually been provisioned and
      # granted via database.sh, otherwise the purge cycle keeps hitting 42501 permission-denied against
      # jube_app and leaking a connection on every failed DeleteAsync. Flip back to True once the grant
      # script above has run and PurgeConnectionString resolves.
      - EnableInfrastructureHealthMetricsPurge=False
      - RespConnectionString=garnet1:6379,garnet2:6379,garnet3:6379,garnet4:6379,password=[@RESP_PASSWORD@],abortConnect=false,syncTimeout=8000,connectTimeout=10000,keepAlive=60
      # ExponentialRetry(base, max) for SE.Redis's background reconnect attempts after the physical connection
      # drops - how fast it retries, not how long an in-flight command waits. SE.Redis doesn't expose the growth
      # rate itself (it's a fixed ~2x-per-attempt curve internally) - the only levers are the floor and the
      # ceiling, so lowered from 100/3000 to keep retries frequent on a brittle WAN link instead of settling into
      # a multi-second gap between attempts once the curve saturates.
      - RespReconnectRetryBaseDelay=50
      - RespReconnectRetryMaxDelay=500
      # True: commands issued while disconnected fail immediately once the connection is known unhealthy, instead
      # of queuing until they hit their own syncTimeout above - the mechanism that used to hold transactions for a
      # long period during a genuine network break. Chosen over the (default False) queue-and-wait behaviour for
      # the same brittle-WAN reasoning as the retry cadence above - fail fast and let the caller's own retry/
      # fallback handle it, rather than blocking on a connection that may not come back soon.
      - RespBacklogFailFast=True
      - JWTKey=[@JWT_KEY@]
      - ElementSymmetricEncryptionKey=[@ENCRYPTION_KEY@]
      # jube-jobs is the only service with these background-processing flags (plus EnableMigration below) set
      # True - jube-api/jube-ui have every one of them False. Several are documented as safe to run on only
      # one instance at a time; letting every scaled jube-api/jube-ui replica also run them would mean N
      # copies of the same job racing each other. jube-jobs is deployed as a singleton for exactly this reason
      # (replicas: 0 below, scaled to exactly 1 manually) - jube-api/jube-ui are the stateless,
      # horizontally-scaled request handlers.
      - EnableExhaustiveTraining=True
      - EnableReprocessing=True
      - EnableAskJooby=${EnableAskJooby}
      - AskJoobyApiKey=[@ASK_JOOBY_API_KEY@]
      - EnableSanctionLoader=True
      - CachePruneServer=True
      - EnableTtlCounter=True
      - EnableSearchKeyCache=True
      - EnableCasesAutomation=True
      - CaseSimilarityHashingKey=[@CASE_SIMILARITY_HASHING_KEY@]
      - StreamingActivationWatcher=False
      - EnableCallback=True
      - PasswordHashingKey=[@PASSWORD_HASHING_KEY@]
      - EnableMigration=True
      - EnableEngine=True
      - EnableEntityModel=True
      - EnablePublicInvokeController=False
      - LocalCache=False
      - LocalCacheBytes=0
      - LocalCacheFill=False
      - RespPublishSubscribeEvents=False
      - Log4NetLogLevel=INFO
      - DOTNET_GC_SERVER=1
      - SecretsPath=/run/secrets/
      # Off by default here - uncomment both to push this service's OpenTelemetry data at the
      # jube-otel-listener sidecar below (a throwaway local receiver for manual testing, not a real
      # collector - see Jube.OpenTelemetryListener/Program.cs). Also requires EnableOpenTelemetry=True.
      - EnableOpenTelemetry=False
      - OpenTelemetryBackendEndpoint=http://jube-otel-listener:4318
    networks:
      jube-cluster:
        aliases:
          - jube-jobs
    deploy:
      #      placement:
      #        constraints:
      #          - node.labels.zone != $CRITICAL_HOST_TIEBREAKER
      replicas: 0
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 180s
        order: stop-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
      rollback_config:
        parallelism: 1
        delay: 60s
        order: stop-first
        failure_action: continue

  jube-r:
    image: ${JUBE_R_IMAGE}
    environment:
      - JUBE_R_HOST=0.0.0.0
      - JUBE_R_PORT=8080
    networks:
      rsandbox:
        aliases:
          - jube-r
    deploy:
      # Unlike jube-api/jube-ui above, this service has no database-migration gate to wait on - it's a
      # stateless sandbox with no schema of its own - so it runs with real replicas from the first deploy
      # rather than sitting at replicas: 0 for a manual scale-up step that doesn't apply to it.
      replicas: 2
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 60s
        order: stop-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
      rollback_config:
        parallelism: 1
        delay: 60s
        order: stop-first
        failure_action: continue

  jube-monitoring:
    image: ${JUBE_MONITORING_IMAGE}
    # A standalone process/image, never a module inside jube-ui/jube-api/jube-jobs above - those must never be
    # given the docker.sock mount below, so Docker host/container monitoring is its own small sidecar instead.
    # It only ever inserts into DockerContainerMetric/DockerHostMetric/HAProxyServerStatus, so it reuses the
    # jube_app credential rather than provisioning a new one.
    secrets:
      - JUBE_APP_PASSWORD
    environment:
      - SecretsPath=/run/secrets/
      - ConnectionString=Host=haproxy;Port=5432;Database=postgres;Username=jube_app;Password=[@JUBE_APP_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=5;
      - DockerSocketPath=/var/run/docker.sock
      - SampleIntervalSeconds=60
      # Scraped once per sample cycle into HAProxyServerStatus (see Jube.Monitoring/HAProxyServerStatusSampler.cs).
      # Defaults to this same value when omitted - only needed here to make the dependency visible/overridable.
      # ";csv" appends to the real haproxy.cfg's "stats uri /", not "/stats" as in some HAProxy doc examples.
      - HAProxyStatsUrl=http://haproxy:7000/;csv
      # Resolved once per sample cycle into HAProxyReachabilityProbe (see
      # Jube.Monitoring/HAProxyReachabilityProbeSampler.cs) - Swarm's per-task DNS convention, returning every
      # individual HAProxy replica's IP directly rather than the "haproxy" hostname's own VIP/IPVS-balanced
      # address, so each replica (and the node it runs on) gets probed on its own. Defaults to this same value.
      - HAProxyTasksHostname=tasks.haproxy
      # Off by default here - uncomment both to push this sidecar's own dynamic log-counter metrics (see
      # Jube.Monitoring/LogCounterMatcher.cs) at the jube-otel-listener sidecar below.
      # - EnableOpenTelemetry=True
      # - OpenTelemetryBackendEndpoint=http://jube-otel-listener:4318
    volumes:
      # Docker socket access is powerful regardless of the read-only bind-mount flag - a process with socket
      # access can still start/stop/inspect containers via the Docker API. This is a real trust decision, not
      # a fully contained one, but it's what this sidecar needs to introspect the cluster.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      jube-cluster:
        aliases:
          - jube-monitoring
    deploy:
      # One instance per physical node, manager or worker - every node in the Swarm is running real workload
      # (Postgres/Patroni/etcd/Redis/HAProxy tasks), and the whole point of this sidecar is host/container
      # monitoring local to wherever Docker itself is running, not just the managers.
      mode: global
      restart_policy:
        condition: on-failure
        delay: 30s

  # A throwaway local OTLP/HTTP receiver for manually confirming OpenTelemetry data actually leaves the
  # cluster during testing -- prints a best-effort summary of every request to console (see
  # Jube.OpenTelemetryListener/Program.cs and ProtobufStringScanner.cs). Not a real collector: no storage, no
  # query API, single replica. Point OpenTelemetryBackendEndpoint at it (see the commented-out lines on
  # jube-ui/jube-api/jube-jobs/jube-monitoring above) and view its output via `docker service logs`.
  jube-otel-listener:
    image: ${JUBE_OTEL_LISTENER_IMAGE}
    networks:
      jube-cluster:
        aliases:
          - jube-otel-listener
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s

