    external: true
  patroni1_tmp:
    external: true
  patroni2_data:
    external: true
  patroni2_tmp:
    external: true
  patroni2_runtime:
    external: true
  patroni3_data:
    external: true
  patroni3_tmp:
    external: true
  patroni3_runtime:
    external: true
  patroni4_data:
