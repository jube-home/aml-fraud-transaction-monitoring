global
maxconn 30000
# Send logs to the container's stdout (HAProxy 2.3+). View with: docker service logs -t <haproxy-service>
# "info" level captures per-request lines as well as health-check and DNS state changes.
log stdout format raw local0 info

resolvers docker
nameserver dns1 127.0.0.11:53
resolve_retries 3
timeout resolve 1s
hold valid 10s
timeout retry 1s
hold other 10s

defaults
log global
mode tcp
# Do not log connections that open and close without sending data (port probes, load balancer checks).
option dontlognull
retries 3
timeout connect 4s
timeout client 30s
timeout server 30s
timeout check 10s

listen stats
mode http
bind *:7000
stats enable
stats uri /
# The stats page refreshes itself, so logging it would only add noise.
no log

frontend jube_api
mode http
# jube-api always listens on 5001 internally (ASPNETCORE_URLS in docker-compose.yml) - 5002 here is only
# the externally published port.
bind *:5002
option forwardfor
http-request set-header X-Forwarded-Proto https
# One log line per request. The default mode is tcp, so the standard http log format is not inherited.
#   rc   number of retries ("+" prefix = redispatched to a different server)
#   Tc   time to connect to the server - high values with rc>0 point to a dead or stale task
#   Tw   time queued waiting for a server slot
#   Tr   server response time - high with normal Tc means the app itself was slow
#   Ta   total time for the request
#   term termination state ("--" = clean, "sC"/"SC" = connect failure or timeout)
log-format "cip=%ci be=%b srv=%s sip=%si:%sp st=%ST term=%tsc rc=%rc Tq=%Tq Tw=%Tw Tc=%Tc Tr=%Tr Ta=%Ta req=%{+Q}r"
default_backend jube_api

backend jube_api
mode http
balance leastconn
# Stateless REST API - no session affinity/cookie needed here (contrast with jube_ui's cookie below).
# "redispatch 1" sends every retry to a different server. Plain "redispatch" only does this on the last
# retry, so a dead task could be tried several times before a healthy one is used.
option redispatch 1
retry-on conn-failure
retries 3
option httpchk GET /api/ready
# Logs each server going UP or DOWN, with the reason, so it can be matched to slow requests.
option log-health-checks
acl server_closing res.hdr(is-closing) -m found
# Open a fresh server connection for each request instead of reusing idle ones. Swarm's overlay forgets
# idle connections after a while, and reusing one that the network has dropped makes the request hang until
# TCP retransmits (roughly 200ms to several seconds). A fresh connect to a healthy task takes about 1ms here,
# and a failed one is caught by the short connect timeout below and retried on another task.
# To go back to pooled connections, replace this line with "option http-keep-alive" and "http-reuse safe".
option http-server-close
# Local network: a healthy connect takes well under 1ms, so anything slow is a dead or unreachable task.
# Failing fast after 20ms lets the retry go straight to a different server (see redispatch above).
# If healthy requests start logging connect failures (term=sC) under load, raise this to 50-100ms.
timeout connect 20ms
timeout server 30s
http-response set-header Connection close if server_closing
# observe layer4: real connect failures count against a server, and 5 in a row mark it down at once
# rather than waiting for the health checks, so a dead task stops receiving requests within moments.
default-server inter 1s fall 2 rise 2 observe layer4 error-limit 5 on-error mark-down resolvers docker resolve-prefer ipv4 init-addr none
server-template jube-api- 20 jube-api:5001 check

frontend jube_ui
mode http
bind *:5001
timeout client 120s
option forwardfor
http-request set-header X-Forwarded-Proto https
# Same fields as jube_api above. Note that long-lived SSE streams are logged when they close, and their
# Ta (total time) will legitimately be very large - this is not a slow request.
log-format "cip=%ci be=%b srv=%s sip=%si:%sp st=%ST term=%tsc rc=%rc Tq=%Tq Tw=%Tw Tc=%Tc Tr=%Tr Ta=%Ta req=%{+Q}r"
default_backend jube_ui

backend jube_ui
mode http
balance leastconn
option redispatch
retries 3
retry-on conn-failure
option httpchk GET /api/ready
# Logs each server going UP or DOWN, with the reason.
option log-health-checks
option http-keep-alive
http-reuse safe
acl server_closing res.hdr(is-closing) -m found
timeout connect 2s
timeout server  30s
timeout tunnel  3600s
http-response set-header Connection close if server_closing
# on-marked-down shutdown-sessions: an SSE stream here can stay open for up to timeout tunnel above.
# Without this, a slot marked DOWN by the health check only stops taking *new* connections - an
# already-open stream to a now-dead container is left alone and just hangs until that hour-long timeout
# expires. This forces existing streams on a downed slot to close immediately, so the browser's EventSource
# reconnects and picks a healthy node right away instead of appearing stuck on a dead container.
default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr none
server-template jube-ui- 20 jube-ui:5001 check

backend postgres_primary
mode tcp
# HAProxy decides primary/replica routing by polling each Patroni node's own REST API rather than
# guessing from a raw TCP check - this is Patroni's own recommended integration pattern, since only
# Patroni itself reliably knows which node currently holds the lease. GET /primary returns 200 only on
# the current leader; see postgres_replicas below for the GET /replica counterpart, and both share the
# "check port 8008" servers below, not 5432 - the health check hits Patroni's REST API, not Postgres
# itself.
option httpchk GET /primary
# Logs a change of leader (one node going UP, the previous one going DOWN) - the key event to match
# against any application errors during a failover. Non-leaders failing this check are expected and
# are not logged.
option log-health-checks
option srvtcpka
timeout server 30m
http-check expect status 200
# on-marked-down shutdown-sessions: existing sessions on a server are terminated immediately when it's
# marked down, rather than left to drain, since a demoted primary must stop taking writes at once.
default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr none
server patroni1 patroni1:5432 maxconn 100 check port 8008
server patroni2 patroni2:5432 maxconn 100 check port 8008
server patroni3 patroni3:5432 maxconn 100 check port 8008
server patroni4 patroni4:5432 maxconn 100 check port 8008

frontend postgres_rw
# Dev only - remove this frontend and postgres_ro below in production. Application services on the
# overlay network reach Postgres via haproxy:5432/haproxy:5433 regardless of whether these are published
# to the host; the host-published ports here exist only so a developer can connect a client directly.
mode tcp
bind *:5432
# One line per connection, written when it closes (connections can last up to 30m). Shows the server
# used, how long the connect took, total duration, bytes, and why it ended.
option tcplog
option clitcpka
timeout client 30m
default_backend postgres_primary

backend postgres_replicas
mode tcp
# Same REST-API-poll reasoning as postgres_primary above - GET /replica returns 200 only on nodes Patroni
# currently considers a healthy standby, never the leader.
option httpchk GET /replica
# Logs a replica dropping out or rejoining. The leader failing this check is expected and not logged.
option log-health-checks
option srvtcpka
timeout server 30m
http-check expect status 200
default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr none
server patroni1 patroni1:5432 maxconn 100 check port 8008
server patroni2 patroni2:5432 maxconn 100 check port 8008
server patroni3 patroni3:5432 maxconn 100 check port 8008
server patroni4 patroni4:5432 maxconn 100 check port 8008

frontend postgres_ro
mode tcp
bind *:5433
# One line per connection, written when it closes - see postgres_rw above.
option tcplog
option clitcpka
timeout client 30m
default_backend postgres_replicas